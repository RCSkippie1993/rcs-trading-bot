name: Digital Product Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  process-decision:
    if: >-
      github.event.issue.title == '[Digital Product Bot] Approval Dashboard' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: digital-product-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r digital-product-bot/requirements.txt

      - name: Verify Phase 3.5
        working-directory: digital-product-bot
        run: |
          python -m py_compile phase3.py phase3_assets.py phase3_copy.py phase3_checks.py etsy_adapter.py
          python selftest_phase3.py

      - name: Process owner command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE3_OUTPUT_DIR: phase3-output
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_TAXONOMY_ID: ${{ secrets.ETSY_TAXONOMY_ID }}
        run: python digital-product-bot/phase3.py

      - name: Upload Phase 3 package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digital-product-phase3-${{ github.run_number }}
          path: phase3-output/
          if-no-files-found: warn
          retention-days: 30
