name: Digital Product Craft Factory

on:
  workflow_dispatch:
  push:
    paths:
      - "digital-product-bot/craft_factory/**"
      - "digital-product-bot/selftest_craft_factory.py"
      - "digital-product-bot/selftest_craft_phase2.py"
      - "digital-product-bot/product_format.py"
      - "digital-product-bot/requirements.txt"
      - ".github/workflows/digital-product-craft.yml"

permissions:
  contents: read

jobs:
  build-craft-product:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: digital-product-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r digital-product-bot/requirements.txt

      - name: Verify craft factory syntax
        run: python -m py_compile digital-product-bot/craft_factory/*.py digital-product-bot/selftest_craft_factory.py digital-product-bot/selftest_craft_phase2.py

      - name: Run craft factory self-test
        working-directory: digital-product-bot
        run: python selftest_craft_factory.py

      - name: Run Craft Factory Phase 2 self-test
        working-directory: digital-product-bot
        run: python selftest_craft_phase2.py

      - name: Build five-shape favor-box review product
        working-directory: digital-product-bot
        run: python -m craft_factory.party_box_bundle --phrase "printable favor box templates" --output-dir craft-phase2-output

      - name: Build leather cardholder review product
        working-directory: digital-product-bot
        run: python -m craft_factory.leather_pattern_factory --phrase "leather card holder pattern pdf" --output-dir leather-pattern-output

      - name: Build felt fox review product
        working-directory: digital-product-bot
        run: python -m craft_factory.felt_pattern_factory --phrase "felt fox sewing pattern pdf" --output-dir felt-pattern-output

      - name: Upload papercraft review package
        uses: actions/upload-artifact@v4
        with:
          name: favor-box-shape-bundle-${{ github.run_number }}
          path: digital-product-bot/craft-phase2-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload leather review package
        uses: actions/upload-artifact@v4
        with:
          name: leather-cardholder-pattern-${{ github.run_number }}
          path: digital-product-bot/leather-pattern-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload felt review package
        uses: actions/upload-artifact@v4
        with:
          name: felt-fox-pattern-${{ github.run_number }}
          path: digital-product-bot/felt-pattern-output/
          if-no-files-found: error
          retention-days: 30
