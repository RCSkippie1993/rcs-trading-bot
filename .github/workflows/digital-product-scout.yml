name: Digital Product Scout

on:
  workflow_dispatch:
  push:
    paths:
      - "digital-product-bot/**"
      - ".github/workflows/digital-product-scout.yml"
  schedule:
    # 06:00 South Africa Standard Time, Monday-Friday (04:00 UTC)
    - cron: "0 4 * * 1-5"

permissions:
  contents: read

jobs:
  scout-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: digital-product-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r digital-product-bot/requirements.txt

      - name: Verify Python syntax
        run: python -m py_compile digital-product-bot/bot.py digital-product-bot/selftest.py

      - name: Run product-factory self-test
        working-directory: digital-product-bot
        run: python selftest.py

      - name: Discover opportunities and create product drafts
        env:
          OUTPUT_DIR: digital-product-output
        run: python digital-product-bot/bot.py

      - name: Upload review queue
        uses: actions/upload-artifact@v4
        with:
          name: digital-product-review-${{ github.run_number }}
          path: digital-product-output/
          if-no-files-found: error
          retention-days: 14
